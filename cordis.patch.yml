# Arya Computer Use bundle patch.
#
# One row: the Host plugin. It registers the skill, the settings page, the chat
# rows, the driver lock, the takeover helper and the status endpoint — and it
# mounts both MCP lanes in-process through the harness's own mcp-client plugin.
#
# Mounting in-process is what makes this bundle installable from a registry:
# no row names an absolute path, and `npx` is never used as an MCP stdio child
# (on Windows that is a .cmd shim, which the client cannot spawn). The lanes are
#   arya_desktop   node <package>/mcp/adapter-server.mjs
#   arya_browser   node <package>/mcp/browser-launcher.mjs
# with both paths derived from the installed package at runtime.
- insert:
    - id: arya-computer-use
      name: '@aryacode/dsh-plugin-arya-computer-use'
      config: {}
